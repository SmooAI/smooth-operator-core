# PR checks for the Python packages published from THIS repo.
#
# `python/core/` is the engine (`smooai-smooth-operator-core`); `python/temporal/`
# is its optional Temporal-backed durable-execution backend
# (`smooai-smooth-operator-temporal`). This workflow gates PRs that touch either:
# it syncs the uv environment, runs ruff (format check + lint), and runs the test
# suite. The temporal package's e2e tests self-skip when no Temporal dev server
# can be reached.
#
# Scoped to the two Python packages so Rust/C#/other-language PRs don't pay for it.
name: Python Checks

on:
    pull_request:
        paths:
            - 'python/core/**'
            - 'python/temporal/**'
            - '.github/workflows/py-checks.yml'

concurrency:
    group: py-checks-${{ github.ref }}
    cancel-in-progress: true

jobs:
    checks:
        name: ruff + pytest (${{ matrix.package }})
        runs-on: ubuntu-latest
        timeout-minutes: 15
        strategy:
            fail-fast: false
            matrix:
                package: [core, temporal]
        defaults:
            run:
                working-directory: python/${{ matrix.package }}
        steps:
            - uses: actions/checkout@v4

            # Toolchains come from mise.toml, read here by mise-action so the runner
            # and a developer's shell resolve identical versions.
            - name: Setup toolchains (mise)
              uses: jdx/mise-action@v4

            - name: Sync (locked)
              run: uv sync --locked

            - name: Ruff format check
              run: uv run --quiet ruff format --check src tests

            - name: Ruff lint
              run: uv run --quiet ruff check src tests

            - name: Pytest
              run: uv run --quiet pytest tests/ -q
