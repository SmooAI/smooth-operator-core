name: Go Checks

on:
    pull_request:
        branches: [main]
        types: [opened, synchronize]

jobs:
    go:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        strategy:
            fail-fast: false
            matrix:
                # Each is its own Go module. `go` is the engine + protocol types;
                # `go/temporal` is the OPTIONAL Temporal-backed durable executor
                # backend (ADR-030) — a separate module so the engine's default
                # build pulls in none of the Temporal SDK. Its e2e tests self-skip
                # when no ephemeral Temporal dev server can be downloaded/started.
                module:
                    - go
                    - go/temporal
        defaults:
            run:
                working-directory: ${{ matrix.module }}

        steps:
            - uses: actions/checkout@v4

            - name: Install Go toolchain
              uses: actions/setup-go@v5
              with:
                  go-version: '1.26'
                  cache-dependency-path: ${{ matrix.module }}/go.sum

            # gofmt -l prints any file that is NOT gofmt-clean. We fail the job if
            # the list is non-empty (the trailing guard).
            - name: Format check (gofmt)
              run: |
                  unformatted="$(gofmt -l .)"
                  if [ -n "$unformatted" ]; then
                      echo "The following files are not gofmt-clean:"
                      echo "$unformatted"
                      exit 1
                  fi

            - name: Vet
              run: go vet ./...

            # -race catches data races; the protocol conformance tests validate the
            # migrated Go types against the shared spec/ fixtures at the repo root.
            # For go/temporal this also runs the durable-execution e2e against an
            # ephemeral dev server (skipped cleanly when the download is blocked).
            - name: Test (race)
              run: go test -race ./...
