# Typecheck + test the TypeScript engine (@smooai/smooth-operator-core).
# Parity for the TS core is enforced here — its Phase-N tests must stay green.
# The live E2E eval (test/evals.test.ts) is gated behind SMOOTH_AGENT_E2E +
# SMOOAI_GATEWAY_KEY and self-skips without them, so this job needs no secrets.
name: TypeScript

on:
    push:
        branches: [main]
        paths:
            - 'typescript/**'
            - 'pnpm-workspace.yaml'
            - 'pnpm-lock.yaml'
            - '.github/workflows/ts-checks.yml'
    pull_request:
        paths:
            - 'typescript/**'
            - 'pnpm-workspace.yaml'
            - 'pnpm-lock.yaml'
            - '.github/workflows/ts-checks.yml'

jobs:
    typecheck-test:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4

            - name: Install pnpm
              uses: pnpm/action-setup@v4

            # Toolchains come from mise.toml, read here by mise-action so the runner
            # and a developer's shell resolve identical versions.
            - name: Setup toolchains (mise)
              uses: jdx/mise-action@v4

            - name: Locate pnpm store
              run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

            - name: Cache pnpm store
              uses: actions/cache@v4
              with:
                  path: ${{ env.STORE_PATH }}
                  key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
                  restore-keys: ${{ runner.os }}-pnpm-store-

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            # Build core first so the optional Temporal package resolves the core
            # `./executor` subpath (dist) it imports.
            - name: Build core
              run: pnpm --filter @smooai/smooth-operator-core build

            - name: Typecheck
              run: pnpm --filter @smooai/smooth-operator-core --filter @smooai/smooth-operator-temporal typecheck

            # The Temporal package's e2e suite is gated behind SMOOTH_TEMPORAL_E2E
            # (unset here) and self-skips, so this needs no Temporal server; only the
            # zero-infra DTO boundary test runs for that package.
            - name: Test
              run: pnpm --filter @smooai/smooth-operator-core --filter @smooai/smooth-operator-temporal test
