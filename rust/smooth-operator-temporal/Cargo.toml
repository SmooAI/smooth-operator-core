[package]
name = "smooai-smooth-operator-temporal"
version = "1.12.0"
edition = "2021"
description = "Optional Temporal-backed durable execution backend for the smooth-operator agent engine (ADR-030)."
license = "MIT"
repository = "https://github.com/SmooAI/smooth-operator-core"
readme = "README.md"
keywords = ["ai", "agent", "temporal", "durable", "workflow"]
categories = ["asynchronous", "api-bindings"]

# The Temporal SDK + workflow/executor wiring is behind the `temporal` feature so
# the default build (and the OSS core's CI) compiles NONE of the preview SDK and
# stays zero-infra. Only `--features temporal` pulls temporalio-* in.
#
# The serde DTO boundary + engine-type conversions (dto.rs) are always compiled
# and tested — they're pure serde over smooth-operator-core types and are what the
# Temporal activities marshal across the activity boundary.
[features]
default = []
temporal = [
    "dep:temporalio-client",
    "dep:temporalio-common",
    "dep:temporalio-macros",
    "dep:temporalio-sdk",
    "dep:temporalio-sdk-core",
    "dep:futures",
    "dep:futures-util",
]

[dependencies]
# `path` for local dev, `version` because a published crate may not depend on a
# bare path. `1.8` (i.e. `^1.8`) rather than the exact lockstep version so this
# line never needs re-syncing on a patch release — any 1.x core from 1.9 up
# satisfies it, and the two ship in lockstep anyway.
#
# Bumped 1.8 -> 1.9 because this crate now reads `LlmResponse::usage_estimated`
# and `::response_id`, which only exist from core 1.9.0. It MUST be raised
# whenever this crate starts using new core API, or the real publish resolves an
# older core off the registry and fails there instead of here.
#
# Known consequence: `cargo publish --dry-run -p ...-temporal` in pr-checks.yml
# cannot pass on the PR that adds the core API, because packaging resolves core
# from the REGISTRY, not the workspace path — and the needed version is not
# published yet. That is structural for any core change touching a public struct
# this crate constructs, not specific to this PR.
smooai-smooth-operator-core = { path = "../smooth-operator-core", version = "1.9" }
anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros"] }
tracing = "0.1"

# Pinned preview SDK (=0.4.0), matching the platform's temporal-worker (ADR-029).
# The macros need temporalio-common + futures + futures-util as DIRECT deps.
temporalio-client = { version = "=0.4.0", optional = true }
temporalio-common = { version = "=0.4.0", optional = true }
temporalio-macros = { version = "=0.4.0", optional = true }
temporalio-sdk = { version = "=0.4.0", optional = true }
temporalio-sdk-core = { version = "=0.4.0", optional = true, features = ["ephemeral-server"] }
futures = { version = "0.3", optional = true }
futures-util = { version = "0.3", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "rt-multi-thread"] }
anyhow = "1"
url = "2"
