[project]
name = "smooai-smooth-operator-temporal"
version = "1.8.10"
description = "Optional Temporal-backed durable execution backend for the smooth-operator Python agent engine (ADR-030). The Python sibling of the smooai-smooth-operator-temporal Rust crate."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    # The durable backend drives the engine's own deterministic `drive_turn`
    # orchestration, so it depends on the core engine. `>=1.8` (not the exact
    # lockstep version) so this line never needs re-syncing on a patch release.
    "smooai-smooth-operator-core>=1.8",
]

# The Temporal SDK is an OPTIONAL extra, mirroring the Rust crate's off-by-default
# `temporal` cargo feature: the serde DTO boundary imports no Temporal SDK, so a
# consumer that does not opt in stays zero-infra. Enable with the `temporal` extra.
[project.optional-dependencies]
temporal = ["temporalio>=1.8"]

[dependency-groups]
# `dev` is synced by default, so the repo's own `uv sync` gets `temporalio` and the
# skip-gated e2e tests can import it (they still self-skip when no Temporal dev
# server is reachable).
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "temporalio>=1.8",
]

[tool.uv.sources]
smooai-smooth-operator-core = { path = "../core", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smooth_operator_temporal"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
extend-select = ["I"]
